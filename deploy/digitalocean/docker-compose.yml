# Corpus360 on one DigitalOcean Droplet: the app (built from the repo's Dockerfile) and PostgreSQL 18 (as on Render).
# Settings and secrets come from /opt/corpus360/.env, written once by setup.sh. Never commit that file.
name: corpus360
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledgerly
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/… (mount the parent).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly -d ledgerly"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 128mb

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: corpus360-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - /opt/corpus360/.env
      - site.env
    environment:
      DATABASE_URL: postgres://ledgerly:${POSTGRES_PASSWORD}@db:5432/ledgerly
      NODE_ENV: production
      PORT: "10000"
      # The database is backed up nightly by the host (see update.sh / setup.sh), not inside the container.
      BACKUPS_ENABLED: "0"
    # Reached only through Caddy (below), on the private network.
    expose:
      - "10000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:10000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    env_file: site.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
