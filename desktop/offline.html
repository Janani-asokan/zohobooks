<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CorpusLite</title>
<style>body{margin:0;height:100vh;display:grid;place-items:center;font:15px/1.5 "Segoe UI",system-ui,sans-serif;background:#f7f8fa;color:#1f2937}
.box{text-align:center;max-width:380px;padding:24px}h1{font-size:20px;margin:0 0 8px}p{margin:0 0 20px;color:#6b7280}
button{font:inherit;font-weight:600;padding:10px 22px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}</style></head>
<body><div class="box"><h1>No internet connection</h1><p>CorpusLite needs the internet the first time it opens on this computer. After that, counter billing keeps working without internet. Check your Wi-Fi or cable, then try again.</p>
<button onclick="window.corpusDesktop.retry()">Try again</button></div>
<script>window.addEventListener('online',()=>window.corpusDesktop.retry());setInterval(()=>navigator.onLine&&window.corpusDesktop.retry(),15000)</script></body></html>
