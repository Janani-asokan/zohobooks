# One-click deploy: https://render.com/deploy?repo=https://github.com/Janani-asokan/zohobooks
databases:
  - name: ledgerly-db
    plan: free
    databaseName: ledgerly
    user: ledgerly

services:
  - type: web
    name: ledgerly-books
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerly-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Loads the demo shops on the first start.
      - key: SEED_DEMO
        value: "1"
      # Demo mode: demo logins use the simple passwords (owner123, admin123 …) and the
      # login page lists them. Anyone with the link can sign in — set to "0" before real use;
      # the demo accounts then fall back to DEMO_PASSWORD on the next fresh seed.
      - key: DEMO_SIMPLE_PASSWORDS
        value: "1"
      - key: DEMO_PASSWORD
        generateValue: true
      # Optional: set in the Render dashboard to turn on the smart reader for uploaded PDFs and photos.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Email (password resets, invoices, reminders). Render's free plan blocks SMTP ports, so use an
      # HTTPS provider: BREVO_API_KEY (free, 300 emails/day) or RESEND_API_KEY. MAIL_FROM must be a
      # sender verified with that provider, e.g. "Corpus360 <you@gmail.com>".
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Money lending: encrypts borrowers' Aadhaar numbers. Set once and never change it, or saved numbers can't be read.
      - key: AADHAAR_KEY
        generateValue: true
      - key: BACKUPS_ENABLED
        value: "0"
