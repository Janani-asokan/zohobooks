# One-click deploy: https://render.com/deploy?repo=https://github.com/Janani-asokan/zohobooks
databases:
  - name: ledgerly-db
    plan: free
    databaseName: ledgerly
    user: ledgerly

services:
  - type: web
    name: ledgerly-books
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerly-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Loads the demo shops on the first start. All demo accounts use DEMO_PASSWORD
      # (generated by Render — copy it from the service's Environment tab).
      - key: SEED_DEMO
        value: "1"
      - key: DEMO_PASSWORD
        generateValue: true
      - key: BACKUPS_ENABLED
        value: "0"
