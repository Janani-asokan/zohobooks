# Builds the server's Docker image on GitHub (free for public repositories) and publishes it to GitHub's container
# registry. The DigitalOcean server then just downloads it (about a minute) instead of building on its single CPU
# with 1 GB of memory, which took 20+ minutes and made the live site slow while it ran. See deploy/digitalocean/update.sh.
name: Server image

on:
  push:
    branches: [claude/blissful-hamilton-n7kcit, main]
    # Same list update.sh skips: changes the server doesn't run.
    paths-ignore: ['mobile/**', 'e2e/**', 'docs/**', '*.md', 'deploy/digitalocean/*.md', '.env.app', '.github/workflows/corpuslite.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lower case, as the registry requires)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zohobooks-server" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
