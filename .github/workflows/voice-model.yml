# Fetches the voice billing speech model (also fetched by the Windows installer build) and keeps it as a download,
# for testing the recogniser outside the installer.
name: Voice model
on:
  workflow_dispatch:
  push:
    branches: [claude/blissful-hamilton-n7kcit]
    paths: ['desktop/scripts/voice-model.mjs', '.github/workflows/voice-model.yml']
permissions:
  contents: write
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: desktop
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --no-audit --no-fund && node scripts/voice-model.mjs
      - uses: actions/upload-artifact@v4
        with: { name: voice-model-en-in, path: desktop/build/voice/en-in.tar.gz, retention-days: 30 }
      # Also kept on its own branch (never merged), so builds and tests can fetch it with plain git.
      - name: Keep on the voice-model branch
        run: |
          mkdir /tmp/vm && cp desktop/build/voice/en-in.tar.gz /tmp/vm/ && cd /tmp/vm
          git init -q -b voice-model && git add en-in.tar.gz
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Vosk small en-in 0.4 (repacked)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" voice-model
